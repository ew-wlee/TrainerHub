name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build TrainerHub.exe
        run: uv run pyinstaller packaging/trainerhub.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          TRAINERHUB_SMOKE_TEST: "1"
        run: |
          if (-not (Test-Path "dist/TrainerHub.exe")) { throw "TrainerHub.exe was not produced" }
          Get-Item "dist/TrainerHub.exe" | Format-List Name, Length

          # Boot the bundled UI offscreen and let the app exit itself. A missing
          # Qt plugin or resource fails here instead of on a reviewer's machine.
          $process = Start-Process -FilePath "dist/TrainerHub.exe" -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw "TrainerHub.exe did not exit within 90s — UI failed to start"
          }
          if ($process.ExitCode -ne 0) { throw "TrainerHub.exe exited with code $($process.ExitCode)" }
          Write-Host "TrainerHub.exe booted and exited cleanly"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainerHub-Windows-x64
          path: dist/TrainerHub.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrainerHub.exe
          generate_release_notes: true
          body: |
            Download `TrainerHub.exe` below and double-click it — no Python install required.

            下载下方的 `TrainerHub.exe`，双击即可运行，无需安装 Python。
